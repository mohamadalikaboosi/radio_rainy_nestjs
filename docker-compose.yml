services:
  # The whole app: API + admin panel + radio stream (+ ffmpeg). Panel: http://localhost:3000
  # Setup: copy .env.example to .env, fill TELEGRAM_SESSION_ENCRYPTION_KEY and JWT_SECRET, then: docker compose up -d --build
  # First login: admin / admin (the panel forces you to change the password before anything else works).
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/radio_rainy
      REDIS_URL: redis://redis:6379
      TELEGRAM_SESSION_ENCRYPTION_KEY: ${TELEGRAM_SESSION_ENCRYPTION_KEY:?set TELEGRAM_SESSION_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUDIO_CACHE_DIR: /data/audio-cache
      AUDIO_CACHE_MAX_MB: ${AUDIO_CACHE_MAX_MB:-1024}
      # tuning (all optional; the defaults below are the app's own)
      RADIO_PREFETCH_SECONDS: ${RADIO_PREFETCH_SECONDS:-90}
      RADIO_PREFETCH_TIMEOUT_SECONDS: ${RADIO_PREFETCH_TIMEOUT_SECONDS:-60}
      RADIO_BUFFER_WHOLE_TRACK: ${RADIO_BUFFER_WHOLE_TRACK:-true}
      RADIO_PREBUFFER_SECONDS: ${RADIO_PREBUFFER_SECONDS:-2}
      RADIO_STREAM_BITRATE_KBPS: ${RADIO_STREAM_BITRATE_KBPS:-128}
      RADIO_LOW_QUALITY_ENABLED: ${RADIO_LOW_QUALITY_ENABLED:-true}
      RADIO_LOW_BITRATE_KBPS: ${RADIO_LOW_BITRATE_KBPS:-48}
      TELEGRAM_DOWNLOAD_REQUEST_KB: ${TELEGRAM_DOWNLOAD_REQUEST_KB:-512}
      TELEGRAM_LIVE_TEXT_DELAY_SECONDS: ${TELEGRAM_LIVE_TEXT_DELAY_SECONDS:-3}
      TELEGRAM_LIVE_QUALITY: ${TELEGRAM_LIVE_QUALITY:-auto}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes: ["audio-cache:/data/audio-cache"]
    ports: ["${APP_PORT:-3000}:3000"]
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}", POSTGRES_DB: radio_rainy }
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d radio_rainy"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  # Audio cache. In the panel: Settings -> Audio storage -> endpoint minio:9000 (or localhost:9000 when the API runs on the host),
  # access key/secret = MINIO_ROOT_USER/PASSWORD below. The bucket is created automatically.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: radiorainy
      MINIO_ROOT_PASSWORD: radiorainy-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  pg-data:
  redis-data:
  minio-data:
  audio-cache:
